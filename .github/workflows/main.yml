name: Debug Runner

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: self-hosted

    steps:
      - name: ✅ Runner Info
        run: |
          echo "Running on $(uname -a)"
          which flutter || echo "❌ flutter not found"
          flutter --version || echo "❌ flutter not working"

      - name: ✅ Echo Works
        run: echo "🎉 Runner is working"
